name: Задача
description: Рабочая задача для команды
title: "[Задача] "
labels: ["тип: задача"]
body:
  - type: textarea
    id: what
    attributes:
      label: Что нужно сделать
      description: Коротко и понятно, по пунктам
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Какой результат
      description: Что будет готово, когда задача закрыта
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Кто отвечает
      options: [Продакт, Проджект, Аналитик, Техлид, Разработчик, Дизайнер, ИИ-инженер]
    validations:
      required: true
  - type: input
    id: due
    attributes:
      label: Срок
      placeholder: "ДД.ММ"
  - type: dropdown
    id: priority
    attributes:
      label: Приоритет
      options: [Высокий, Средний, Низкий]
