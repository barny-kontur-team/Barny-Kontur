server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location = /login {
        try_files /index.html =404;
    }

    location = /favicon.ico {
        try_files /favicon.svg =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
